# Stock Watchlist Configuration

stocks:
  - ticker: AAPL
    alert_thresholds:
      rsi_oversold: 30
      rsi_overbought: 70
      price_drop_pct: 5.0
      volume_spike: 2.0
    monitoring_frequency: daily

  - ticker: MSFT
    alert_thresholds:
      rsi_oversold: 30
      rsi_overbought: 70
      price_drop_pct: 5.0
      volume_spike: 2.0
    monitoring_frequency: daily

  - ticker: XOM
    alert_thresholds:
      rsi_oversold: 35
      rsi_overbought: 65
      price_drop_pct: 4.0
      volume_spike: 1.8
    monitoring_frequency: daily

  - ticker: CVX
    alert_thresholds:
      rsi_oversold: 35
      rsi_overbought: 65
      price_drop_pct: 4.0
      volume_spike: 1.8
    monitoring_frequency: daily

  - ticker: SLB
    alert_thresholds:
      rsi_oversold: 30

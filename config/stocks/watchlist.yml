      price_drop_pct: 6.0
      volume_spike: 2.5
    monitoring_frequency: daily

  - ticker: COP
    alert_thresholds:
      rsi_oversold: 35
      rsi_overbought: 65
      price_drop_pct: 4.5
      volume_spike: 2.0
    monitoring_frequency: daily

  - ticker: OXY
    alert_thresholds:

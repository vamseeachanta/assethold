site_name: assethold
site_description: Asset analysis toolkit — equities, real estate, and portfolio management
site_url: https://vamseeachanta.github.io/assethold/
repo_url: https://github.com/vamseeachanta/assethold
repo_name: vamseeachanta/assethold

docs_dir: docs
site_dir: site

theme:
  name: material
  features:
    - navigation.sections
    - navigation.expand
    - navigation.indexes
    - search.highlight
    - content.code.copy
  palette:
    - scheme: default
      primary: indigo
      accent: indigo

plugins:
  - search
  - mkdocstrings:
      enable_inventory: false
      default_handler: python
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: google
            show_source: true
            show_root_heading: true
            members_order: source

nav:
  - Home: index.md
  - Architecture: architecture.md
  - API Reference:
      - Overview: api/index.md
      - daily_strategy: api/daily_strategy.md
      - fundamentals: api/fundamentals.md
      - risk_metrics: api/risk_metrics.md
      - signals: api/signals.md
      - portfolio: api/portfolio.md
      - net_lease: api/net_lease.md
      - survey_measure: api/survey_measure.md
      - land_development: api/land_development.md
  - Guides:
      - Parcel measurement: guides/parcel-measurement.md
      - Land subdivision: guides/land-subdivision.md
  - Standards:
      - Repository structure: standards/repo-structure.md
      - Print report generation: standards/print-report-generation.md
      - HTML reporting: HTML_REPORTING_STANDARDS.md
  - Domain:
      - Houston/Harris County site standards: domain/realestate/re_cre/houston-harris-county-site-standards.md
  - Modules:
      - daily_strategy: modules/stocks/data.md
      - fundamentals: modules/portfolio/portfolio_ffn_vs_assethold_calc.md
      - risk_metrics: api/risk_metrics.md
      - stocks: modules/stocks/literature.md
      - portfolio: modules/portfolio/portfolio_ffn_vs_assethold_calc.md

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      permalink: true

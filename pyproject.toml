[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "assethold"
version = "0.1.0"
description = "Standardized project configuration for assethold"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Development Team", email = "dev@example.com"}
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
]

dependencies = [
    "assetutilities",
    "beautifulsoup4==4.13.4",
    "bumpver==2024.1130",
    "dash==3.0.4",
    "dash_bootstrap_components==2.0.2",
    "deepdiff",
    "excel2img; sys_platform=='win32'",
    "ffn",
    "finvizfinance==1.1.0",
    "flask",
    "gitpython>=3.1.40",
    "jinja2",
    "loguru",
    "matplotlib",
    "mypy>=1.19.1",
    "numpy",
    "numpy_financial==1.0.0",
    "openpyxl",
    "pandas==2.2.3",
    "plotly==6.0.1",
    "PyPDF2",
    "python-certifi-win32; sys_platform=='win32'",
    "python-docx",
    "pyyaml==6.0.2",
    "ruamel.yaml",
    "sec_edgar_downloader==5.0.3",
    "sqlalchemy==2.0.40",
    "sympy>=1.13.3",
    "ta==0.11.0",
    "urllib3==2.4.0",
    "webcolors",
    "xlsxwriter",
    "xmltodict==0.14.2",
    "yahoo_fin==0.8.9.1",
    "yfinance>=1.2.0",
]

[project.optional-dependencies]
gis = [
    # Lightweight tier — pure Python, no C library deps
    "geopy>=2.4.0",
    "folium>=0.15.0",
    "simplekml>=1.3.6",
    # Shapely 2.x ships binary wheels on all platforms (no PROJ/GDAL dep)
    "shapely>=2.0.0",
    # Full spatial tier — requires GDAL/PROJ system libraries on Linux:
    #   apt install gdal-bin libgdal-dev proj-bin
    "geopandas>=0.14.0",
    "rasterio>=1.3.0",
    # Satellite imagery APIs (require external account registration)
    # "sentinelsat>=1.2.0",   # Copernicus Open Access Hub
    # "landsatxplore>=0.15.0",  # USGS EarthExplorer
    # "geemap>=0.30.0",         # Google Earth Engine Python wrapper
]
dev = [
    "build",
    "twine",
    "ruff",
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "pytest-mock>=3.0",
    "black>=23.0",
    "flake8>=6.0",
    "mypy>=1.0",
    "pre-commit>=3.0",
]
test = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "pytest-mock>=3.0",
]
docs = [
    "sphinx>=6.0",
    "sphinx-rtd-theme>=1.0",
    "mkdocs>=1.6.0",
    "mkdocstrings[python]>=0.25.0",
    "mkdocs-material>=9.5.0",
]
providers = [
    "diskcache>=5.6.0",
    "finnhub-python>=2.4.0",
]

[project.urls]
"Homepage" = "https://github.com/username/assethold"
"Bug Tracker" = "https://github.com/username/assethold/issues"
"Documentation" = "https://github.com/username/assethold#readme"

[tool.setuptools.packages.find]
where = ["src"]
include = ["assethold*"]
exclude = ["tests*", "docs*", "scripts*", "business*"]

[tool.black]
line-length = 88
target-version = ['py39', 'py310', 'py311', 'py312']
include = '\.pyi?$'

[tool.isort]
profile = "black"
line_length = 88

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--cov=src",
    "--cov=.",
    "--cov-report=term-missing",
    "--cov-report=html:htmlcov",
    "--cov-report=xml:coverage.xml",
    "--cov-fail-under=80",
    "--strict-markers",
    "--strict-config",
    "--verbose",
    "-ra",
    "--junitxml=pytest.xml"
]
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "e2e: End-to-end tests",
    "slow: Slow running tests",
    "api: API tests",
    "database: Database tests",
    "external: Tests requiring external services",
    "financial: Financial calculation tests",
    "scraping: Web scraping tests",
    "dashboard: Dashboard/UI tests"
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning"
]

[tool.coverage.run]
source = ["src", "."]
omit = [
    "*/tests/*",
    "*/test_*.py",
    "*/__pycache__/*",
    "*/venv/*",
    "*/.venv/*",
    "*/build/*",
    "*/dist/*",
    "setup.py",
    "conftest.py"
]
branch = true
data_file = ".coverage"

[tool.coverage.report]
precision = 2
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "def __str__",
    "if self.debug:",
    "if __name__ == .__main__.:",
    "raise AssertionError",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod"
]

[tool.coverage.html]
directory = "htmlcov"
title = "Assethold Coverage Report"

[tool.coverage.xml]
output = "coverage.xml"

[tool.uv]
# UV environment configuration
python = "3.11"
system = false
seed = true
compile = true
required-environments = ["sys_platform == 'linux'", "sys_platform == 'win32'", "sys_platform == 'darwin'"]

[tool.uv.sources]
assetutilities = { path = "../assetutilities" }

[tool.uv.pip]
index-url = "https://pypi.org/simple"
extra-index-url = []
no-cache = false
pre = false


[dependency-groups]
docs = [
    "mkdocs>=1.6.0",
    "mkdocstrings[python]>=0.25.0",
    "mkdocs-material>=9.5.0",
]
dev = [
    "pytest-cov>=7.0.0",
    "pytest-mock>=3.15.1",
    "pytest-xdist>=3.8.0",
]


[tool.bandit]
exclude_dirs = ["tests", "docs"]
skips = []

[pytest]
testpaths = tests
pythonpath = src
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*
addopts =
    -v
    --tb=short
    --strict-markers
    --disable-warnings
    --ignore=tests/modules/multifamily/test_1.py
    --ignore=tests/modules/stocks/analysis/breakout
    --ignore=tests/modules/stocks/analysis/investment/test_csv_comparison.py
    --ignore=tests/modules/stocks/analysis/investment/test_deepdiff_comparison.py
    --ignore=tests/modules/stocks/analysis/investment/test_investment_ffn.py
    --ignore=tests/modules/stocks/analysis/investment/test_investment_value.py
    --ignore=tests/modules/stocks/analysis/portfolio/test_portfolio_AI.py
    --ignore=tests/modules/stocks/data/test_data_AAPL.py
    --ignore=tests/modules/stocks/data/test_data_RIG.py
    --ignore=tests/modules/stocks/data/test_stock_data.py
    --ignore=tests/test_smoke.py
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks tests as integration tests
    unit: marks tests as unit tests
    live_data: tests that require live network/external APIs (excluded by default)
minversion = 7.0

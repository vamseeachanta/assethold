# UV Configuration - Modernized for assethold
# Version: 2.0.0
# UV Version: 0.4.0+
# Last Updated: 2025-09-28

[project]
name = "assethold"
version = "0.1.0"
description = "Asset management and financial analysis tools"
requires-python = ">=3.9"

dependencies = [
    # Core dependencies managed in pyproject.toml
]

[tool.uv]
python = "3.11"
system = false
compile = true
seed = true

# Development dependencies (updated versions)
dev-dependencies = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "pytest-mock>=3.12.0",
    "pytest-xdist>=3.5.0",
    "pytest-benchmark>=4.0.0",
    "black>=24.0.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
    "bandit>=1.7.6",
    "safety>=3.0.0",
    "ipython>=8.20.0",
    "jupyter>=1.0.0",
]

# Package installation settings
[tool.uv.pip]
index-url = "https://pypi.org/simple"
pre = false
no-cache = false

# Virtual environment
[tool.uv.venv]
prompt = "assethold"
system-site-packages = false

# Parallel processing for package installation
[tool.uv.parallel]
enabled = true
jobs = 4

# UV Scripts for common tasks
[tool.uv.scripts]
test = "pytest tests/ -v"
test-cov = "pytest tests/ --cov=src --cov-report=term-missing"
test-bench = "pytest tests/ --benchmark-only"
lint = "ruff check . && black --check . && mypy src/"
format = "ruff check . --fix && black ."
typecheck = "mypy src/ --strict"
security = "bandit -r src/ && safety check"
dev = "python -m IPython"
notebook = "jupyter notebook"
clean = """
    rm -rf build dist *.egg-info .coverage htmlcov .pytest_cache .mypy_cache .ruff_cache
    find . -type d -name __pycache__ -exec rm -rf {} + 2>/dev/null || true
"""
update = "uv pip compile --upgrade && uv lock --upgrade"

# UV Sources for local dependencies
[tool.uv.sources]
assetutilities = { path = "../assetutilities" }

# Migration notes
# Successfully migrated from Poetry to UV
# All dependencies now managed via pyproject.toml and UV
# Use 'uv sync' to install all dependencies

# Python Tests GitHub Actions Workflow for Assethold
#
# Comprehensive testing workflow for assethold financial asset management application

name: Python Tests

on:
  push:
    branches: [ main, develop ]
    paths:
      - '**/*.py'
      - 'requirements*.txt'
      - 'pyproject.toml'
      - 'uv.toml'
      - 'setup.py'
      - 'setup.cfg'
      - '.github/workflows/python-tests.yml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - '**/*.py'
      - 'requirements*.txt'
      - 'pyproject.toml'
      - 'uv.toml'
      - 'setup.py'
      - 'setup.cfg'
  workflow_dispatch:
  schedule:
    # Run tests every Sunday at 2 AM UTC
    - cron: '0 2 * * 0'

env:
  # Global environment variables
  PYTHONUNBUFFERED: 1
  FORCE_COLOR: 1

jobs:
  test:
    name: Test on Python ${{ matrix.python-version }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45

    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.9', '3.10', '3.11', '3.12']
        os: [ubuntu-latest, windows-latest, macos-latest]
        # Exclude combinations to optimize CI time
        exclude:
          - os: windows-latest
            python-version: '3.9'
          - os: macos-latest
            python-version: '3.9'

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Install uv
      uses: astral-sh/setup-uv@v1
      with:
        version: "latest"

    - name: Install dependencies with uv
      run: |
        uv pip install --system -r requirements.txt
        uv pip install --system pytest pytest-cov pytest-mock pytest-xdist pytest-benchmark
        uv pip install --system black flake8 mypy bandit safety

    - name: Install project in development mode
      run: uv pip install --system -e .

    - name: Lint with flake8
      run: |
        # Stop the build if there are Python syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # Exit-zero treats all errors as warnings
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=88 --statistics

    - name: Type checking with mypy
      run: mypy src/ --ignore-missing-imports
      continue-on-error: true

    - name: Security check with bandit
      run: bandit -r src/ -f json -o bandit-report.json
      continue-on-error: true

    - name: Safety check for vulnerabilities
      run: safety check --json --output safety-report.json
      continue-on-error: true

    - name: Run smoke tests first
      run: |
        pytest tests/test_smoke.py \
          --verbose \
          --tb=short
      env:
        TESTING: true

    - name: Run unit tests with coverage
      run: |
        pytest tests/unit/ \
          --cov=src \
          --cov=. \
          --cov-report=xml \
          --cov-report=html \
          --cov-report=term-missing \
          --cov-fail-under=80 \
          --junitxml=pytest-unit.xml \
          --verbose \
          -m "unit"
      env:
        TESTING: true
        DATABASE_URL: sqlite:///:memory:

    - name: Run all tests with coverage
      run: |
        pytest \
          --cov=src \
          --cov=. \
          --cov-report=xml \
          --cov-report=html \
          --cov-report=term-missing \
          --cov-fail-under=70 \
          --junitxml=pytest.xml \
          --verbose
      env:
        # Environment variables for testing
        TESTING: true
        DATABASE_URL: sqlite:///:memory:
        ALPHA_VANTAGE_API_KEY: test-key
        FINNHUB_API_KEY: test-key
        FLASK_ENV: testing

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      if: matrix.python-version == '3.11' && matrix.os == 'ubuntu-latest'
      with:
        file: ./coverage.xml
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false

    - name: Upload test results
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: test-results-${{ matrix.python-version }}-${{ matrix.os }}
        path: |
          pytest.xml
          pytest-unit.xml
          htmlcov/
          bandit-report.json
          safety-report.json
        retention-days: 30

    - name: Upload coverage reports
      uses: actions/upload-artifact@v3
      if: matrix.python-version == '3.11' && matrix.os == 'ubuntu-latest'
      with:
        name: coverage-report
        path: |
          coverage.xml
          htmlcov/
        retention-days: 30

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 60

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_assethold_db
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v4
      with:
        python-version: 3.11
        cache: 'pip'

    - name: Install uv
      uses: astral-sh/setup-uv@v1
      with:
        version: "latest"

    - name: Install dependencies
      run: |
        uv pip install --system -r requirements.txt
        uv pip install --system pytest pytest-cov pytest-mock pytest-xdist
        uv pip install --system -e .

    - name: Wait for services
      run: |
        # Wait for PostgreSQL
        until pg_isready -h localhost -p 5432; do sleep 1; done
        # Wait for Redis
        until redis-cli -h localhost -p 6379 ping; do sleep 1; done

    - name: Run integration tests
      run: |
        pytest tests/integration/ \
          --cov=src \
          --cov-report=xml \
          --verbose \
          -m "integration" \
          --tb=short
      env:
        DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_assethold_db
        REDIS_URL: redis://localhost:6379/0
        TESTING: true

  financial-data-tests:
    name: Financial Data Integration
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 30

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v4
      with:
        python-version: 3.11
        cache: 'pip'

    - name: Install uv
      uses: astral-sh/setup-uv@v1
      with:
        version: "latest"

    - name: Install dependencies
      run: |
        uv pip install --system -r requirements.txt
        uv pip install --system pytest pytest-cov pytest-mock
        uv pip install --system -e .

    - name: Run financial calculation tests
      run: |
        pytest tests/ \
          --cov=src \
          --verbose \
          -m "financial" \
          --tb=short
      env:
        TESTING: true

    - name: Run scraping tests (mocked)
      run: |
        pytest tests/ \
          --verbose \
          -m "scraping" \
          --tb=short
      env:
        TESTING: true

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v4
      with:
        python-version: 3.11

    - name: Install uv
      uses: astral-sh/setup-uv@v1
      with:
        version: "latest"

    - name: Install security tools
      run: |
        uv pip install --system bandit safety

    - name: Run bandit security scan
      run: |
        bandit -r . \
          -f json \
          -o bandit-security-report.json \
          --exclude tests/
      continue-on-error: true

    - name: Run safety vulnerability check
      run: |
        safety check \
          --json \
          --output safety-vulnerability-report.json
      continue-on-error: true

    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@master
      with:
        scan-type: 'fs'
        scan-ref: '.'
        format: 'sarif'
        output: 'trivy-results.sarif'

    - name: Upload Trivy scan results to GitHub Security tab
      uses: github/codeql-action/upload-sarif@v2
      if: always()
      with:
        sarif_file: 'trivy-results.sarif'

    - name: Upload security reports
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: security-reports
        path: |
          bandit-security-report.json
          safety-vulnerability-report.json
          trivy-results.sarif
        retention-days: 30

  quality-gate:
    name: Quality Gate
    runs-on: ubuntu-latest
    needs: [test, integration-tests, financial-data-tests]
    if: always()

    steps:
    - name: Check test results
      run: |
        echo "Checking test results..."
        if [[ "${{ needs.test.result }}" != "success" ]]; then
          echo "❌ Unit tests failed"
          exit 1
        fi
        if [[ "${{ needs.integration-tests.result }}" != "success" ]]; then
          echo "❌ Integration tests failed"
          exit 1
        fi
        if [[ "${{ needs.financial-data-tests.result }}" != "success" ]]; then
          echo "❌ Financial data tests failed"
          exit 1
        fi
        echo "✅ All tests passed"

    - name: Quality gate passed
      run: |
        echo "🎉 Quality gate passed! Assethold testing infrastructure is ready."
        echo "📊 All financial calculations and data processing tests passed"
        echo "🔒 Security scans completed"
        echo "🚀 Ready for deployment"